# TrazaGrafo - Neo4j + carga de datos + API (FastAPI)
# Uso:  cp .env.example .env   (editar la clave)   &&   docker compose up --build

services:
  neo4j:
    image: neo4j:5-community
    container_name: trazagrafo-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"   # Neo4j Browser  -> http://localhost:7474
      - "7687:7687"   # Bolt (API y cypher-shell)
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - trazagrafo-net

  # Corre una sola vez: crea restricciones, nodos y relaciones, y termina.
  neo4j-seed:
    image: neo4j:5-community
    container_name: trazagrafo-seed
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./scripts/seed.cypher:/seed.cypher:ro
    entrypoint:
      - cypher-shell
      - -a
      - bolt://neo4j:7687
      - -u
      - neo4j
      - -p
      - ${NEO4J_PASSWORD}
      - -f
      - /seed.cypher
    restart: "no"
    networks:
      - trazagrafo-net

  api:
    build: .                # Dockerfile en la raiz; copia ./app
    container_name: trazagrafo-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      neo4j-seed:
        condition: service_completed_successfully
    environment:
      NEO4J_URI: bolt://neo4j:7687   # dentro de Docker: nombre del servicio, no localhost
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "8000:8000"   # Swagger -> http://localhost:8000/docs
    networks:
      - trazagrafo-net

volumes:
  neo4j_data:

networks:
  trazagrafo-net:
